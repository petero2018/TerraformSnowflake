databases:
  bronze:
    comment: "The Bronze Layer is where we land all the data from external source systems. The table structures in this layer correspond to the source system table structures 'as-is,' along with any additional metadata columns that capture the load date/time, process ID, etc."
  silver:
    comment: "The Silver layer is where we apply standardisation to our source datasets. This standardisation aligns field names across sources, applies common data cleaning operations and organises the data into a well known structure."
  gold:
    comment: "The Gold layer is for reporting and uses more de-normalized and read-optimized data models with fewer joins. The final layer of data transformations and data quality rules are applied here."
  operations:
    comment: "This database is designed to store dbt operation materialised data."
  retl:
    comment: "This database is designed to store retl operations produced data."

# Explicit database roles to create (db, kind). Kinds are open-ended.
database_roles:
  - { db: operations, kind: RW }
  - { db: operations, kind: R }
  - { db: bronze,     kind: RW }
  - { db: bronze,     kind: R }
  - { db: silver,     kind: RW }
  - { db: silver,     kind: R }
  - { db: gold,       kind: RW }
  - { db: gold,       kind: R }
  - { db: retl,       kind: RW }
  - { db: retl,       kind: R }

warehouses:
  transform:
    warehouse_size: SMALL
    comment: "The Transform Warehouse is used by external transformation tools. Unlike ingestion tools, these external tools may not have their own scalable functionality. Therefore, a burstable larger warehouse size might be required as demand increases."
  ingestion:
    warehouse_size: SMALL
    comment: "The Ingestion Warehouse is used by external ingestion tools and processes."
  reporting:
    warehouse_size: MEDIUM
    comment: "The Reporting Warehouse is used by external reporting and analytics tools and processes."
  retl:
    warehouse_size: SMALL
    comment: "The rETL Warehouse is used by external tools and processes for rETL operations."
  browse:
    warehouse_size: XSMALL
    comment: "Browse-only warehouse for business users"

# Warehouse grants (role mappings)
warehouse_grants:
  - { warehouse: transform, role_type: technical, role_keys: ["transform"] }
  - { warehouse: ingestion, role_type: technical, role_keys: ["ingestion"] }
  - { warehouse: reporting, role_type: technical, role_keys: ["reporting"] }
  - { warehouse: retl,      role_type: technical, role_keys: ["retl"] }
  - { warehouse: browse,    role_type: business,  role_keys: ["analytics_engineer", "data_engineer", "data_scientist", "analyst", "browser"] }

technical_roles:
  transform:
    parent_role: SYSADMIN
    db_role_grants:
      - { db: operations, kind: RW }
      - { db: operations, kind: R }
      - { db: bronze,     kind: RW }
      - { db: bronze,     kind: R }
      - { db: silver,     kind: RW }
      - { db: silver,     kind: R }
      - { db: gold,       kind: RW }
      - { db: gold,       kind: R }
  ingestion:
    parent_role: SYSADMIN
    db_role_grants:
      - { db: bronze, kind: RW }
      - { db: bronze, kind: R }
  reporting:
    parent_role: SYSADMIN
    db_role_grants:
      - { db: gold, kind: R }
  retl:
    parent_role: SYSADMIN
    db_role_grants:
      - { db: gold, kind: R }

service_users:
  dbt:
    name_prefix: "DBT_SERVICE_USER"
    default_role_key: "transform"
    default_warehouse_key: "transform"
    default_database_key: "silver"
    default_secondary_roles_option: "ALL"
    technical_role_keys: ["transform"]

  dbt_operations:
    name_prefix: "DBT_SERVICE_USER_OPERATIONS"
    default_role_key: "transform"
    default_warehouse_key: "transform"
    default_database_key: "silver"
    default_secondary_roles_option: "ALL"
    technical_role_keys: ["transform"]

  fivetran:
    name_prefix: "FIVETRAN_SERVICE_USER"
    default_role_key: "ingestion"
    default_warehouse_key: "ingestion"
    default_database_key: "bronze"
    default_secondary_roles_option: "ALL"
    technical_role_keys: ["ingestion"]

  kafka:
    name_prefix: "KAFKA_SERVICE_USER"
    default_role_key: "ingestion"
    default_warehouse_key: "ingestion"
    default_database_key: "bronze"
    default_secondary_roles_option: "ALL"
    technical_role_keys: ["ingestion"]

  airflow:
    name_prefix: "AIRFLOW_SERVICE_USER"
    default_role_key: "ingestion"
    default_warehouse_key: "ingestion"
    default_database_key: "bronze"
    default_secondary_roles_option: "ALL"
    technical_role_keys: ["ingestion"]

  looker:
    name_prefix: "LOOKER_SERVICE_USER"
    default_role_key: "reporting"
    default_warehouse_key: "reporting"
    default_database_key: "gold"
    default_secondary_roles_option: "ALL"
    technical_role_keys: ["reporting"]

  growthbook:
    name_prefix: "GROWTHBOOK_SERVICE_USER"
    default_role_key: "reporting"
    default_warehouse_key: "reporting"
    default_database_key: "gold"
    default_secondary_roles_option: "ALL"
    technical_role_keys: ["reporting"]

# Enable dynamic table grants (optional)
object_types_for_grants: ["TABLES", "VIEWS", "DYNAMIC TABLES", "MATERIALIZED VIEWS", "STAGES", "FILE FORMATS", "EXTERNAL TABLES", "FUNCTIONS", "PIPES", "ICEBERG TABLES"]

# Define business roles (env-scoped); fill db_role_grants as needed
business_roles:
  analytics_engineer:
    parent_role: SYSADMIN
    db_role_grants:
      - { db: bronze, kind: R }
      - { db: silver, kind: R }
      - { db: gold,   kind: R }
  data_engineer:
    parent_role: SYSADMIN
    db_role_grants:
      - { db: bronze, kind: R }
      - { db: silver, kind: R }
      - { db: gold,   kind: R }
  data_scientist:
    parent_role: SYSADMIN
    db_role_grants:
      - { db: gold,   kind: R }
  analyst:
    parent_role: SYSADMIN
    db_role_grants:
      - { db: gold,   kind: R }
  browser:
    parent_role: SYSADMIN
    db_role_grants:
      - { db: gold,   kind: R }

# Grant business roles to account-level business users
business_role_user_grants:
  BUSINESS_USER_ANALYTICS_ENGINEER: ["analytics_engineer"]
  BUSINESS_USER_DATA_ENGINEER: ["data_engineer"]
  BUSINESS_USER_DATA_SCIENTIST: ["data_scientist"]
  BUSINESS_USER_ANALYST: ["analyst"]
  BUSINESS_USER_BROWSER: ["browser"]

# Optional: custom, fine-grained schema object grants per database role.
# Example below grants all schemaObjectPrivileges across gold DB for R role,
# and restricts REPORTING schema tables to SELECT only.
custom_schema_roles:
  gold:
    restricted_all:
      comment: "Role with broad schema-object privileges, not assigned by default"
      grants:
        - { object_type: "*", scope: all, all_privileges: true }
        - { object_type: "TABLES", scope: all, schema: "REPORTING", privileges: ["SELECT"] }

# Sample schemas
schemas:
  bronze:
    - { name: SAMPLE_BRONZE_SCHEMA_ONE }
    - { name: SAMPLE_BRONZE_SCHEMA_TWO }
    - { name: SAMPLE_BRONZE_SCHEMA_THREE }
  silver:
    - { name: SAMPLE_SILVER_SCHEMA_ONE }
    - { name: SAMPLE_SILVER_SCHEMA_TWO }
    - { name: SAMPLE_SILVER_SCHEMA_THREE }
  gold:
    - { name: SAMPLE_GOLD_SCHEMA_ONE }
    - { name: SAMPLE_GOLD_SCHEMA_TWO }
    - { name: SAMPLE_GOLD_SCHEMA_THREE }

# Privileges for auto-created schema roles (per DB)
schema_role_privileges:
  bronze:
    R:  ["USAGE"]
    RW: ["USAGE", "CREATE TABLE", "CREATE VIEW"]
  silver:
    R:  ["USAGE"]
    RW: ["USAGE", "CREATE TABLE", "CREATE VIEW"]
  gold:
    R:  ["USAGE"]
    RW: ["USAGE", "CREATE TABLE", "CREATE VIEW"]

# schema_privileges intentionally omitted while focusing only on schema creation
