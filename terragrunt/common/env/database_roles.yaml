# Database roles — per-database role definitions with shared privilege profiles.
#
# ─── Name generation ──────────────────────────────────────────────────────────
# If role_name is omitted:
#   DATABASE_ROLE_<DB>_<ENV>_<PROFILE>   (if profile is set)
#   DATABASE_ROLE_<DB>_<ENV>_<ROLE_KEY>  (if no profile)
#
#   e.g. database=silver, env=DEV, profile=R_DEFAULT → DATABASE_ROLE_SILVER_DEV_R_DEFAULT
#        database=gold,   env=PROD, role_key=READ_WRITE, profile=RW_DEFAULT → DATABASE_ROLE_GOLD_PROD_RW_DEFAULT
#
# If role_name is set → used exactly as-is (custom roles only)
#
# ─── databases.<db>.roles structure ──────────────────────────────────────────
# databases:
#   <database_key>:              ← must match a key in databases.yaml
#     roles:
#       <role_key>:
#         profile: <name>        ← reuse a shared privilege_profile (optional)
#         role_name: "..."       ← override generated name (optional, custom roles only)
#         comment:   "..."       ← optional
#         allowed_schemas: [...] ← optional list of schemas; omitted = all schemas (database-level grants)
#         database_privileges: [...]   ← only needed if inline (no profile)
#         schema_privileges:   [...]   ← only needed if inline (no profile)
#         object_privileges:           ← only needed if inline (no profile)
#           TABLES: ["SELECT"]
# ─────────────────────────────────────────────────────────────────────────────

# ── Shared privilege profiles — reusable across any database ─────────────────
privilege_profiles:

  R_DEFAULT:
    database_privileges: ["USAGE"]
    schema_privileges:   ["USAGE"]
    object_privileges:
      TABLES:             ["SELECT"]
      VIEWS:              ["SELECT"]
      DYNAMIC TABLES:     ["SELECT"]
      MATERIALIZED VIEWS: ["SELECT"]
      STAGES:             ["USAGE"]
      FILE FORMATS:       ["USAGE"]
      EXTERNAL TABLES:    ["SELECT"]
      FUNCTIONS:          ["USAGE"]
      PIPES:              ["MONITOR"]
      ICEBERG TABLES:     ["SELECT"]

  RW_DEFAULT:
    database_privileges: ["USAGE"]
    schema_privileges:   ["USAGE", "CREATE TABLE", "CREATE VIEW", "CREATE MATERIALIZED VIEW", "CREATE SEQUENCE"]
    object_privileges:
      TABLES:             ["SELECT", "INSERT", "UPDATE", "DELETE", "TRUNCATE", "REFERENCES"]
      VIEWS:              ["SELECT"]
      DYNAMIC TABLES:     ["SELECT", "MONITOR", "OPERATE"]
      MATERIALIZED VIEWS: ["SELECT", "REFERENCES"]
      STAGES:             ["USAGE", "READ", "WRITE"]
      FILE FORMATS:       ["USAGE"]
      EXTERNAL TABLES:    ["SELECT"]
      FUNCTIONS:          ["USAGE"]
      PIPES:              ["MONITOR", "OPERATE"]
      ICEBERG TABLES:     ["SELECT"]
      SEQUENCES:          ["USAGE"]

  REPORTING_READ:
    comment: "Restricted read-only — TABLES and VIEWS only, no stages/pipes/functions"
    database_privileges: ["USAGE"]
    schema_privileges:   ["USAGE"]
    object_privileges:
      TABLES: ["SELECT"]
      VIEWS:  ["SELECT"]

  ADMIN_READ:
    comment: "Read-only access to admin/metadata schemas — tables and views only"
    database_privileges: ["USAGE"]
    schema_privileges:   ["USAGE"]
    object_privileges:
      TABLES: ["SELECT"]
      VIEWS:  ["SELECT"]

# ── Per-database role definitions ─────────────────────────────────────────────
databases:
  bronze:
    roles:
      READ:
        profile: R_DEFAULT
      READ_WRITE:
        profile: RW_DEFAULT

  silver:
    roles:
      READ:
        profile: R_DEFAULT
      READ_WRITE:
        profile: RW_DEFAULT

  gold:
    roles:
      READ:
        profile: R_DEFAULT
      READ_WRITE:
        profile: RW_DEFAULT
      REPORTING_R:
        role_name: "CUSTOM_R_REPORTING"
        comment:   "Reporting read-only role for GOLD — TABLES and VIEWS only"
        profile:   REPORTING_READ
        allowed_schemas:
          - REPORTING

  operations:
    roles:
      READ:
        profile: R_DEFAULT
      READ_WRITE:
        profile: RW_DEFAULT

  retl:
    roles:
      READ:
        profile: R_DEFAULT
      READ_WRITE:
        profile: RW_DEFAULT

  admin:
    roles:
      READ:
        profile: ADMIN_READ
        role_name: "CUSTOM_ADMIN_R"
        comment:   "Read only for environment specific admins"
