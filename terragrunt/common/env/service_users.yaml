# Service users — machine/tool accounts.
# role:             key into technical_roles (the user receives this role + it becomes their default role)
# warehouse:        key into warehouses (user's default warehouse)
# default_database: key into databases (user's default namespace)

service_users:
  dbt:
    name_prefix:      SERVICE_USER_DBT
    role:             transform
    warehouse:        transform
    default_database: silver
    display_name:     "dbt Service User"

  dbt_operations:
    name_prefix:      SERVICE_USER_DBT_OPERATIONS
    role:             operations
    warehouse:        operations
    default_database: operations
    display_name:     "Transform Operations Service User"

  fivetran:
    name_prefix:      SERVICE_USER_FIVETRAN
    role:             ingestion
    warehouse:        ingestion
    default_database: bronze
    display_name:     "Fivetran Service User"

  kafka:
    name_prefix:      SERVICE_USER_KAFKA
    role:             ingestion
    warehouse:        ingestion
    default_database: bronze
    display_name:     "Kafka Service User"

  airflow:
    name_prefix:      SERVICE_USER_AIRFLOW
    role:             ingestion
    warehouse:        ingestion
    default_database: bronze
    display_name:     "Airflow Service User"

  looker:
    name_prefix:      SERVICE_USER_LOOKER
    role:             reporting
    warehouse:        reporting
    default_database: gold
    display_name:     "Looker Service User"

  growthbook:
    name_prefix:      SERVICE_USER_GROWTHBOOK
    role:             reporting
    warehouse:        reporting
    default_database: gold
    display_name:     "Growthbook Service User"
