# Database roles — standard R/RW roles per database + privilege profiles.
#
# ─── How names are generated ──────────────────────────────────────────────────
# Standard roles:  DATABASE_ROLE_<DB>_<ENV>_<KIND>
#   e.g. database=bronze, env=DEV, kind=R  →  DATABASE_ROLE_BRONZE_DEV_R
#        database=gold,   env=PROD, kind=RW →  DATABASE_ROLE_GOLD_PROD_RW
#
# Custom roles:    DATABASE_ROLE_<DB>_<ENV>_<ROLE_KEY>   (unless name: is set)
#   e.g. database=gold, role_key=restricted_all, env=DEV → DATABASE_ROLE_GOLD_DEV_RESTRICTED_ALL
#
# ─── custom_roles structure ───────────────────────────────────────────────────
# custom_roles:
#   <database_key>:          ← must match a key in databases.yaml
#     <role_key>:            ← becomes part of the role name (uppercased)
#       comment: "..."
#       grants:
#         - object_type: "TABLES"   ← Snowflake object type, or "*" for all
#           scope: all              ← "all" (existing) or "future"
#           schema: "REPORTING"     ← optional: restrict to one schema
#           privileges: ["SELECT"]  ← list, or omit if all_privileges: true
#           all_privileges: true    ← grant ALL PRIVILEGES on the object type
#
# ─────────────────────────────────────────────────────────────────────────────

# Standard role kinds created for every database
standard_roles: ["R", "RW"]

# Privilege profiles: what each kind receives on databases, schemas, and schema objects.
# object_privileges: object_type → list of privileges, or ["ALL"] to mean all_privileges = true.
privilege_profiles:
  R:
    database_privileges: ["USAGE"]
    schema_privileges:   ["USAGE"]
    object_privileges:
      TABLES:             ["SELECT"]
      VIEWS:              ["SELECT"]
      DYNAMIC TABLES:     ["SELECT"]
      MATERIALIZED VIEWS: ["SELECT"]
      STAGES:             ["USAGE"]
      FILE FORMATS:       ["USAGE"]
      EXTERNAL TABLES:    ["SELECT"]
      FUNCTIONS:          ["USAGE"]
      PIPES:              ["MONITOR"]
      ICEBERG TABLES:     ["SELECT"]
  RW:
    database_privileges: ["USAGE"]
    schema_privileges:   ["USAGE", "CREATE TABLE", "CREATE VIEW"]
    object_privileges:
      TABLES:             ["ALL"]
      VIEWS:              ["ALL"]
      DYNAMIC TABLES:     ["ALL"]
      MATERIALIZED VIEWS: ["ALL"]
      STAGES:             ["ALL"]
      FILE FORMATS:       ["ALL"]
      EXTERNAL TABLES:    ["ALL"]
      FUNCTIONS:          ["ALL"]
      PIPES:              ["ALL"]
      ICEBERG TABLES:     ["ALL"]

# Object types to iterate when creating grants
object_types_for_grants:
  - TABLES
  - VIEWS
  - DYNAMIC TABLES
  - MATERIALIZED VIEWS
  - STAGES
  - FILE FORMATS
  - EXTERNAL TABLES
  - FUNCTIONS
  - PIPES
  - ICEBERG TABLES

# Custom database roles — opt-in only, not auto-granted to any account role.
# name is optional; defaults to DATABASE_ROLE_<DB>_<ENV>_<ROLE_KEY>
custom_roles:
  gold:
    restricted_all:
      comment: "Role with broad schema-object privileges — not assigned by default, opt-in only"
      grants:
        - { object_type: "*",      scope: all, all_privileges: true }
        - { object_type: "TABLES", scope: all, schema: "REPORTING", privileges: ["SELECT"] }
