# Human (business) users — account-level, created once (no _DEV/_PROD suffix).
# Auth is managed by Okta SSO — must_change_password and MFA are disabled by Terraform.
# role: business role key from account_roles.yaml
# grant_envs: which env role to grant — ["dev"], ["prod"], or ["dev", "prod"]
#   Only envs that have been applied (05-account-roles) will produce a grant.

human_users:
  BUSINESS_USER_ANALYTICS_ENGINEER:
    display_name: "Analytics Engineer"
    role: analytics_engineer
    query_tag: "Analytics Engineer"
    grant_envs: ["dev", "prod"]

  BUSINESS_USER_DATA_ENGINEER:
    display_name: "Data Engineer"
    role: data_engineer
    query_tag: "Data Engineer"
    grant_envs: ["dev", "prod"]

  BUSINESS_USER_DATA_SCIENTIST:
    display_name: "Data Scientist"
    role: data_scientist
    query_tag: "Data Scientist"
    grant_envs: ["dev", "prod"]

  BUSINESS_USER_ANALYST:
    display_name: "Analyst"
    role: analyst
    query_tag: "Analyst"
    grant_envs: ["dev", "prod"]

  BUSINESS_USER_BROWSER:
    display_name: "Browser"
    role: browser
    query_tag: "Browser"
    grant_envs: ["dev", "prod"]
