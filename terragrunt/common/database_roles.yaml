# Database roles — per-database role definitions with shared privilege profiles.
#
# ─── How names are generated ──────────────────────────────────────────────────
# Profile-based:   DATABASE_ROLE_<DB>_<ENV>_<KIND>
#   e.g. database=bronze, env=DEV, kind=R  →  DATABASE_ROLE_BRONZE_DEV_R
#        database=gold,   env=PROD, kind=RW →  DATABASE_ROLE_GOLD_PROD_RW
#
# Inline/custom:   role_name overrides the generated name completely
#   e.g. role_name: "CUSTOM_DATABASE_ROLE_REPORTING_R" → exact name, no prefix/suffix
#        role_name omitted → DATABASE_ROLE_<DB>_<ENV>_<ROLE_KEY>
#
# ─── databases.<db>.roles structure ──────────────────────────────────────────
# databases:
#   <database_key>:              ← must match a key in databases.yaml
#     roles:
#       <role_key>:
#         profile: <name>        ← reuse a shared privilege_profile (optional)
#         role_name: "..."       ← override generated name (optional, custom roles only)
#         comment:   "..."       ← optional
#         database_privileges: [...]   ← only needed if inline (no profile)
#         schema_privileges:   [...]   ← only needed if inline (no profile)
#         object_privileges:           ← only needed if inline (no profile)
#           TABLES: ["SELECT"]
# ─────────────────────────────────────────────────────────────────────────────

# ── Shared privilege profiles — reusable across any database ─────────────────
# Built-in: R, RW
# Custom:   add any named profile here and reference it in databases.<db>.roles
privilege_profiles:

  R:
    database_privileges: ["USAGE"]
    schema_privileges:   ["USAGE"]
    object_privileges:
      TABLES:             ["SELECT"]
      VIEWS:              ["SELECT"]
      DYNAMIC TABLES:     ["SELECT"]
      MATERIALIZED VIEWS: ["SELECT"]
      STAGES:             ["USAGE"]
      FILE FORMATS:       ["USAGE"]
      EXTERNAL TABLES:    ["SELECT"]
      FUNCTIONS:          ["USAGE"]
      PIPES:              ["MONITOR"]
      ICEBERG TABLES:     ["SELECT"]

  RW:
    database_privileges: ["USAGE"]
    schema_privileges:   ["USAGE", "CREATE TABLE", "CREATE VIEW"]
    object_privileges:
      TABLES:             ["ALL"]
      VIEWS:              ["ALL"]
      DYNAMIC TABLES:     ["ALL"]
      MATERIALIZED VIEWS: ["ALL"]
      STAGES:             ["ALL"]
      FILE FORMATS:       ["ALL"]
      EXTERNAL TABLES:    ["ALL"]
      FUNCTIONS:          ["ALL"]
      PIPES:              ["ALL"]
      ICEBERG TABLES:     ["ALL"]

  REPORTING_READ:
    comment: "Restricted read-only — TABLES and VIEWS only, no stages/pipes/functions"
    database_privileges: ["USAGE"]
    schema_privileges:   ["USAGE"]
    object_privileges:
      TABLES: ["SELECT"]
      VIEWS:  ["SELECT"]

  ADMIN_READ:
    comment: "Read-only access to admin/metadata schemas — tables and views only"
    database_privileges: ["USAGE"]
    schema_privileges:   ["USAGE"]
    object_privileges:
      TABLES: ["SELECT"]
      VIEWS:  ["SELECT"]

# ── Per-database role definitions ─────────────────────────────────────────────
# Each key must match a key in databases.yaml
databases:
  bronze:
    roles:
      R:  { profile: R }
      RW: { profile: RW }

  silver:
    roles:
      R:  { profile: R }
      RW: { profile: RW }

  gold:
    roles:
      R:  { profile: R }
      RW: { profile: RW }

      REPORTING_R:
        role_name: "CUSTOM_DATABASE_ROLE_REPORTING_R"
        comment:   "Reporting read-only role for GOLD — TABLES and VIEWS only"
        profile:   REPORTING_READ

  operations:
    roles:
      R:  { profile: R }
      RW: { profile: RW }

  retl:
    roles:
      R:  { profile: R }
      RW: { profile: RW }

  admin:
    roles:
      R:  { profile: R }
      RW: { profile: RW }
