# Warehouses — logical key → config.
# Snowflake name: upper(key)_ENV  (e.g. TRANSFORM_DEV)

warehouses:
  transform:
    size: SMALL
    comment: "The Transform Warehouse is used by external transformation tools. Unlike ingestion tools, these external tools may not have their own scalable functionality. Therefore, a burstable larger warehouse size might be required as demand increases."
  ingestion:
    size: SMALL
    comment: "The Ingestion Warehouse is used by external ingestion tools and processes."
  reporting:
    size: MEDIUM
    comment: "The Reporting Warehouse is used by external reporting and analytics tools and processes."
  retl:
    size: SMALL
    comment: "The rETL Warehouse is used by external tools and processes for rETL operations."
  browse:
    size: XSMALL
    comment: "Browse-only warehouse for business users."
  operations:
    size: SMALL
    comment: "Operations transformation warehouse for serice users."

# Warehouse → role grants.
# technical_warehouse_grants: warehouse key → list of technical role keys (receive USAGE + MONITOR)
# business_warehouse_grants:  warehouse key → list of business role keys  (receive USAGE + MONITOR + OPERATE)
technical_warehouse_grants:
  transform:  [transform]
  ingestion:  [ingestion]
  reporting:  [reporting]
  retl:       [retl]
  operations:  [operations]

business_warehouse_grants:
  browse: [analytics_engineer, data_engineer, data_scientist, analyst, browser]
